name: Deploy presentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: MalSentinal/Project_InsightUI

      - name: Build static presentation
        run: bun run build
        working-directory: MalSentinal/Project_InsightUI
        continue-on-error: true
        env:
          GITHUB_PAGES: "true"

      - name: Prepare Pages artifact
        working-directory: MalSentinal/Project_InsightUI
        shell: bash
        run: |
          test -d .output/public
          if [ ! -f .output/public/index.html ]; then
            css=$(find .output/public/assets -maxdepth 1 -name '*.css' -printf '%f\n' | head -n 1)
            scripts=$(find .output/public/assets -maxdepth 1 -name 'index-*.js' -printf '%f\n' | sort)
            {
              printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
              printf '<link rel="stylesheet" href="./assets/%s">\n' "$css"
              printf '%s\n' '</head><body><div id="root"></div>'
              while IFS= read -r script; do
                printf '<script type="module" src="./assets/%s"></script>\n' "$script"
              done <<< "$scripts"
              printf '%s\n' '</body></html>'
            } > .output/public/index.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: MalSentinal/Project_InsightUI/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4